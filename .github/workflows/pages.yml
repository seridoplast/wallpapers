name: Publicar Wallpaper Studio no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Validar arquivos
        run: |
          node --check app.js
          python -m json.tool themes.json > /dev/null
          test -f index.html
          test -f assets/wallpaper-base.png
          test -f assets/seridoplast-symbol.png
      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp index.html app.js style.css themes.json favicon.ico _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
